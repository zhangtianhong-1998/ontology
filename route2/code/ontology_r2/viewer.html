.details{max-height:calc(100vh - 135px);overflow:auto;padding:17px}.details h2{font-size:17px;margin:0 0 6px;line-height:1.4;overflow-wrap:anywhere}.kind{font-size:11px;color:#38648c;background:#eaf2fb;border-radius:4px;padding:3px 6px;display:inline-block;margin-bottom:9px}.id{font-size:11px;color:#75879a;overflow-wrap:anywhere}.label{font-size:11px;font-weight:600;color:#79899a;margin:15px 0 5px}.value{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.section{border-top:1px solid #e5edf3;padding-top:13px;margin-top:17px}.section h3,.evidence h3{font-size:13px;margin:0 0 9px}.item{display:block;width:100%;text-align:left;border:1px solid #e2eaf1;background:#fbfdff;border-radius:6px;padding:8px 9px;margin:5px 0;color:#34516b;overflow-wrap:anywhere;line-height:1.4}.item:hover{background:#edf5fb}.item small{display:block;color:#798a9c;font-size:10px;margin-top:3px}.empty{font-size:12px;color:#79899a;line-height:1.55}.evidence{border-top:1px solid #e5edf3;padding-top:13px;margin-top:20px}.quote{padding:9px 10px;border-left:3px solid #97b7d7;background:#f5f9fc;font-size:12px;line-height:1.6;margin:7px 0;overflow-wrap:anywhere}.quote small{display:block;color:#72869a;margin-top:4px}.plain{font-size:12px;color:#596d80;line-height:1.6;overflow-wrap:anywhere}footer{font-size:11px;color:#8391a0;padding:12px 1px 0}

<header><div><h1>本体结构浏览</h1><p id="run-info"></p></div><div class="switch" aria-label="图谱选择"><button type="button" data-mode="ontology" class="active" aria-pressed="true">本体结构</button><button type="button" data-mode="metadata" aria-pressed="false">元数据图</button></div><span id="status" class="status"></span></header>
<main><p id="notice" class="notice"></p><div class="layout">
<section class="graph-pane" aria-label="结构图"><div class="graph-head"><div><h2 id="graph-title"></h2><p id="graph-subtitle"></p></div><div class="graph-actions"><button id="zoom-out" class="view-control" type="button" aria-label="缩小画布" title="缩小">−</button><span id="zoom-level" class="zoom-level" aria-live="polite">100%</span><button id="zoom-in" class="view-control" type="button" aria-label="放大画布" title="放大">+</button><button id="zoom-fit" class="view-control" type="button" aria-label="适配整个图" title="适配整个图">适配全图</button><button id="zoom-selection" class="view-control" type="button" disabled>聚焦邻域</button><button id="pin-selection" class="view-control" type="button" disabled aria-pressed="false">固定节点</button><button id="relayout" class="view-control" type="button">重新排布</button><button id="numeric-toggle" class="view-control" type="button" aria-pressed="false" hidden>显示数字重合候选</button><button id="search-toggle" class="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel">搜索节点</button></div></div><div id="search-panel" class="search-panel" hidden><input id="search" aria-label="搜索节点" placeholder="搜索名称或编号…"><div id="index-list"></div></div><div id="graph-viewport" class="graph-viewport"><svg id="graph" viewBox="0 0 1100 680" role="img" aria-label="整体本体类型与关系图"></svg></div><div id="graph-foot" class="graph-foot"></div></section>
<aside id="details" class="details" aria-label="节点详情"></aside></div><footer>本地文件浏览。本体对象关系与物理元数据分开呈现；结构校验不代表业务语义正确。</footer></main>
<script id="result-data" type="application/json">__RESULT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('result-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const O=D.ontology||{},M=D.metadata||{},X=D.association_preview||{links:[]},OV=D.ontology_overview||{nodes:[],inheritance:[],relations:[],omitted_relation_type_ids:[]},types=[...(O.object_roots||[]),...(O.object_types||[])],relations=[...(O.relation_roots||[]),...(O.relation_types||[])],attrs=O.attributes||[];
const T=new Map(types.map(x=>[x.id,x])),R=new Map(relations.map(x=>[x.id,x])),A=new Map(attrs.map(x=>[x.id,x])),TABLE=new Map((M.tables||[]).map(x=>[x.id,x]));
const INSTANCE=new Map();for(const x of [...(D.concepts||[]),...(D.objects||[]),...(D.instance_preview||[])])INSTANCE.set(x.id,{...(INSTANCE.get(x.id)||{}),...x});
const INSTANCE_RELATION=new Map([...(D.relations||[]),...(D.instance_relations||[])].map(x=>[x.id,x]));
const LITERAL=new Map([...INSTANCE.values()].flatMap(x=>(x.preview_attributes||[]).map(a=>[a.id,a])));
const METADATA_ITEM=new Map();for(const [owner,detail] of Object.entries(M.details||{}))for(const kind of ['columns','constraints','sources','record_types'])for(const item of detail[kind]||[])METADATA_ITEM.set(item.id,{item,owner,kind});
const rootNames={GeneralObject:'一般对象',Measure:'度量',Metric:'指标',Dimension:'维度',Term:'术语'};
const rootOf=x=>{let current=x,seen=new Set();while(current&&current.parent&&!seen.has(current.id)){seen.add(current.id);current=T.get(current.parent)}return current?.id||x?.parent||x?.id};
const typeKind=x=>x?.category==='source_record_type'?'源记录结构':rootNames[rootOf(x)]||'对象类型';
const name=x=>rootNames[x?.id]||x?.label||x?.table_comment||x?.column_name||x?.table_name||x?.constraint_name||x?.id||'未命名';
let showNumericMatches=false;
let mode='ontology',selected=null,tableId=(M.tables||[])[0]?.id||null;
const expandedTables=new Set();
const text=x=>x==null?'—':typeof x==='object'?JSON.stringify(x,null,2):String(x);
const clip=(x,n=19)=>String(x||'').length>n?String(x).slice(0,n-1)+'…':String(x||'');
function el(tag,content,cls){const node=document.createElement(tag);if(content!==undefined)node.textContent=String(content);if(cls)node.className=cls;return node}
function svgEl(tag,attrs={}){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,String(v)));return node}
function field(panel,label,value){if(value===undefined||value===null||value==='')return;panel.append(el('div',label,'label'),el('div',text(value),'value'))}
function button(title,subtitle,fn){const b=el('button',undefined,'item');b.type='button';b.append(el('span',title));if(subtitle)b.append(el('small',subtitle));b.onclick=fn;return b}
function section(panel,title,items,fn,empty='无'){const s=el('section',undefined,'section');s.append(el('h3',`${title} · ${items.length}`));if(items.length)items.forEach(x=>s.append(fn(x)));else s.append(el('p',empty,'empty'));panel.append(s)}
function evidence(panel,item){const ids=item?.evidence_ids||[],s=el('section',undefined,'evidence');s.append(el('h3',`证据 · ${ids.length}`));if(!ids.length)s.append(el('p','没有单独保存证据原文。','empty'));
ids.forEach(id=>{const e=D.evidence?.[id];if(e){const box=el('div',e.raw_fragment||'原文未保存','quote'),src=e.source_ref||{};box.append(el('small',[src.table,src.column,src.row&&`第 ${src.row} 行`,src.document_id].filter(Boolean).join(' · ')||id));s.append(box)}else s.append(el('p',`证据标识：${id}（原文未进入页面预览）`,'plain'))});panel.append(s)}
function select(kind,id){selected={kind,id};if(mode==='metadata'){if(kind==='table')tableId=id;else if(METADATA_ITEM.has(id))tableId=METADATA_ITEM.get(id).owner;}$('search-panel').hidden=true;$('search-toggle').setAttribute('aria-expanded','false');renderGraph();renderDetails();focusSelection()}
// Inherited properties retain their declaring type and evidence in details.
function typeAncestors(id){const result=new Set();let current=T.get(id);while(current&&!result.has(current.id)){result.add(current.id);current=T.get(current.parent)}return result}
function objectRels(id){const ancestors=typeAncestors(id);return (O.relation_types||[]).filter(r=>r.category==='business_relation_type'&&[...(r.domain||[]),...(r.range||[])].some(type=>ancestors.has(type)))}
function objectAttrs(id){const ancestors=typeAncestors(id);return attrs.filter(a=>(a.domain||[]).some(type=>ancestors.has(type)))}
function instanceKind(x){return ({definition_record_instance:'配置定义记录实例',definition_slot_occurrence:'配置定义槽位实例'})[x.instance_kind]||(x.id.startsWith('fact_observation:')?'业务事实观测实例':x.id.startsWith('concept:')?'定义概念记录':'源记录实例')}
function objectInstances(id){return [...INSTANCE.values()].filter(x=>typeAncestors(x.ontology_type_id||x.type).has(id))}
function inheritedFrom(item,id){return (item.domain||[]).includes(id)?'':(item.domain||[]).filter(type=>typeAncestors(id).has(type)).map(type=>name(T.get(type))).join('、')}
function verifiedEquivalentTypes(x){return [...new Set(x.equivalent_type_ids||[])].filter(id=>id!==x.id&&T.has(id)).map(id=>T.get(id))}
function equivalenceEvidence(x){return (O.type_equivalences||[]).filter(a=>a.source_type_id===x.id||a.target_type_id===x.id)}
function sourceBindings(type){
  const bindings=[...(type.source_properties||[])];for(const a of objectAttrs(type.id)){if(a.source_table)bindings.push({source_table:a.source_table,source_column:a.source_column});bindings.push(...(a.source_bindings||[]))}
  const found=new Map();for(const b of bindings){const table=b.source_table||b.table,column=b.source_column||b.column;if(table&&TABLE.has(table))found.set(`${table}.${column||''}`,{table,column})}return [...found.values()]
}
function sourceDetails(panel,type){
  const bindings=sourceBindings(type);if(!bindings.length)return;
  section(panel,'物理来源',bindings,b=>button(`${TABLE.get(b.table)?.table_name||b.table}${b.column?'.'+b.column:''}`,'查看元数据与字段关联',()=>{switchMode('metadata');tableId=b.table;select('table',b.table)}));
  const links=(M.links||[]).filter(link=>bindings.some(b=>(b.table===link.source&&(!b.column||b.column===link.source_field))||(b.table===link.target&&(!b.column||b.column===link.target_field))));
  if(links.length){const fold=el('details');fold.append(el('summary',`字段关联依据 · ${links.length}`));section(fold,'技术匹配',links.slice(0,20),link=>button(`${link.source_field} → ${link.target_field}`,`${link.source} → ${link.target} · ${linkLabel(link.status)}`,()=>{switchMode('metadata');tableId=link.source;select('technical_link',link.id)}));fold.append(el('p','这里显示来源字段的技术匹配，业务含义见对象关系。','empty'));panel.append(fold)}
}
function templateDetails(panel,type){
  const preview=D.templates||{},projections=(preview.projections||[]).filter(x=>x.object_type_id===type.id),bindings=(preview.bindings||[]).filter(x=>x.object_type_id===type.id),relations=(preview.ontology_bindings||[]).filter(x=>x.source_type_id===type.id||x.target_type_id===type.id),ids=new Set(projections.map(x=>x.template_id));
  const pending=(preview.pending||[]).filter(x=>ids.has(x.template_id));
  if(!projections.length&&!bindings.length&&!relations.length&&!pending.length&&!preview.truncated&&!(preview.warnings||[]).length)return;
  const roles={business_object:'经营对象',measure:'度量',dimension:'维度',reference:'引用',record_identity:'记录标识'};
  section(panel,'定义模板',projections,x=>{const box=el('div',undefined,'quote');field(box,'模板编号',x.template_id);field(box,'来源表',x.source_table);field(box,'固定口径',x.invariants);field(box,'字段模式',x.field_templates);for(const slot of x.slots||[])box.append(button(`${slot.label||slot.name} · ${roles[slot.role]||slot.role}`,slot.target_type_id?name(T.get(slot.target_type_id)):slot.source_column||'未确定目标类型',()=>{if(slot.target_type_id)select('object',slot.target_type_id)}));evidence(box,x);return box},'当前预览未载入此类型的模板');
  if(bindings.length)section(panel,`绑定实例预览 · 已扫描 ${preview.binding_prefix_counts?.[type.id]||bindings.length} 条`,bindings,x=>{const box=el('div',undefined,'quote');field(box,'源记录',`${x.source_table} · 第 ${x.row_number??'—'} 行`);field(box,'记录编号',x.record_id);field(box,'具体取值',x.slot_values);field(box,'独立引用',x.reference_values);field(box,'核验方法',x.method);evidence(box,x);return box});
  if(relations.length)section(panel,'成分关系依据',relations,x=>{const box=el('div',undefined,'quote');box.append(button(`${name(T.get(x.source_type_id))} → ${name(T.get(x.target_type_id))}`,roles[x.slot?.role]||x.slot?.role||'已核验关系',()=>select('relation',x.relation_type_id)));field(box,'适用范围',x.slot?.binding_scope);field(box,'成员条件',x.slot?.selector);field(box,'核验契约',x.contract);evidence(box,x);return box});
  if(pending.length)section(panel,'待确定的成分关系',pending,x=>el('p',`${x.slot?.name||'关系'}：${x.reason||'依据不足'}`,'plain'));
  if(preview.warnings?.length)panel.append(el('p',`以下预览文件未能完整读取：${preview.warnings.join('、')}。`,'risk-warning'));
  panel.append(el('p',preview.notice||'绑定实例不进入本体主图。','empty'));if(preview.truncated)panel.append(el('p','页面只读取了导出文件的一部分，完整绑定见 template_bindings.yaml 和 ontology_bindings.yaml。','empty'))
}
function mappedRecordType(table,detail){const id=table.source_record_type||detail.record_types?.[0]?.id||`source_record_type:${table.id}`;return T.get(id)||detail.record_types?.find(x=>x.id===id)||null}
function linkLabel(status){return {declared:'声明外键',verified_technical:'已核验技术匹配',observed_subset:'部分命中',candidate:'待核验候选'}[status]||status||'未知'}
$('run-info').textContent=`${D.run_name} · ${D.manifest.input_tables??'—'} 张输入表 · ${D.manifest.input_records??'—'} 条输入记录`;
$('status').textContent={complete:'执行完成',partial:'部分完成',failed:'执行失败'}[D.manifest.status]||'状态未记录';$('status').classList.add(D.manifest.status||'unknown');
function switchMode(next){mode=next;selected=null;$('search').value='';$('search-panel').hidden=true;$('search-toggle').setAttribute('aria-expanded','false');document.querySelectorAll('[data-mode]').forEach(x=>{const active=x.dataset.mode===next;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('search-toggle').onclick=()=>{const open=$('search-panel').hidden;$('search-panel').hidden=!open;$('search-toggle').setAttribute('aria-expanded',String(open));if(open){renderIndex();$('search').focus()}};$('search').oninput=renderIndex;
function renderIndex(){const list=$('index-list'),q=$('search').value.trim().toLowerCase();list.replaceChildren();if($('search-panel').hidden)return;if(!q){list.append(el('p','输入名称或编号后显示匹配结果。','empty'));return}

function ontologyGraph(){

// Layout depends on checked graph topology, not business names or file order.
function tableLabelLines(value){
  const chars=[...String(value||'')],lines=[];let line='',width=0;
  for(const char of chars){const next=/[\u2e80-\u9fff]/u.test(char)?11:6;if(width+next>68){lines.push(line);line='';width=0;if(lines.length===2){lines[1]=lines[1].slice(0,-1)+'…';return lines}}line+=char;width+=next}
  if(line)lines.push(line);return lines.slice(0,2)
}
function metadataPositions(tables,links,focus=null,focusRadius=225,aspect=1.4){
  const ids=new Set(tables.map(t=>t.id)),degree=new Map(tables.map(t=>[t.id,0])),pairs=new Map();
  links.forEach(e=>{if(e.source===e.target||!ids.has(e.source)||!ids.has(e.target))return;const key=[e.source,e.target].sort().join('|');if(!pairs.has(key)){pairs.set(key,e);degree.set(e.source,degree.get(e.source)+1);degree.set(e.target,degree.get(e.target)+1)}});
  const order=[...tables].sort((a,b)=>degree.get(b.id)-degree.get(a.id)||a.id.localeCompare(b.id));
  if(focus&&ids.has(focus)){const rest=order.filter(t=>t.id!==focus),radius=Math.max(focusRadius,rest.length*26),out=new Map([[focus,{x:0,y:0}]]);rest.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/rest.length;out.set(t.id,{x:radius*Math.cos(a),y:radius*Math.sin(a)})});return out}
  // Preserve connected components in a readable grid; the old force layout compressed hubs.
  const neighbors=new Map(order.map(t=>[t.id,new Set()]));for(const e of pairs.values()){neighbors.get(e.source).add(e.target);neighbors.get(e.target).add(e.source)}
  const seen=new Set(),walk=[];for(const start of order){if(seen.has(start.id))continue;const queue=[start.id];seen.add(start.id);for(let i=0;i<queue.length;i++){const id=queue[i];walk.push(id);const next=[...neighbors.get(id)].sort((a,b)=>degree.get(b)-degree.get(a)||a.localeCompare(b));for(const other of next)if(!seen.has(other)){seen.add(other);queue.push(other)}}}
  const columns=Math.max(1,Math.ceil(Math.sqrt(walk.length*Math.max(.5,aspect)*220/240)));
  return new Map(walk.map((id,i)=>[id,{x:(i%columns)*240,y:Math.floor(i/columns)*220}]))
}
// Numeric coincidences remain inspectable without dominating the default map.

    (showNumeric||x.status==='declared'||!x.numeric_overlap_only))
}
$('numeric-toggle').onclick=()=>{showNumericMatches=!showNumericMatches;$('numeric-toggle').setAttribute('aria-pressed',String(showNumericMatches));$('numeric-toggle').textContent=showNumericMatches?'收起数字重合候选':'显示数字重合候选';selected=null;render()};
let metadataLinkGroups=new Map();

    columns.forEach((column,i)=>{const angle=-Math.PI/2+2*Math.PI*(i%10)/Math.min(10,columns.length),radius=130+Math.floor(i/10)*110,x=pos.x+Math.cos(angle)*radius,y=pos.y+Math.sin(angle)*radius;

      edges.push({from:t.id,to:column.id,kind:'table_has_column',label:'含字段',showLabel:false,quiet:true});
    });

  $('graph-foot').textContent=`绿色为声明外键，蓝色为技术匹配，棕色为部分命中。双箭头表示两个方向均有字段关联，具体条件见右侧。${focus?`当前聚焦 ${name(TABLE.get(focus))}，右侧可恢复全图。`:'默认仅显示主要连线标签，所有细线仍可点击。'}${M.total_tables>allTables.length?'页面仅显示部分表。':''}`;
