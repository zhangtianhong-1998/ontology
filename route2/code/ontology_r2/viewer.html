<header><div><h1>本体结构浏览</h1><p id="run-info"></p></div><div class="switch" aria-label="图谱选择"><button type="button" data-mode="ontology" class="active" aria-pressed="true">本体结构</button><button type="button" data-mode="metadata" aria-pressed="false">元数据图</button></div><span id="status" class="status"></span></header>
<main><p id="notice" class="notice"></p><div class="layout">
<section class="graph-pane" aria-label="结构图"><div class="graph-head"><div><h2 id="graph-title"></h2><p id="graph-subtitle"></p></div><div class="graph-actions"><button id="zoom-out" class="view-control" type="button" aria-label="缩小画布" title="缩小">−</button><span id="zoom-level" class="zoom-level" aria-live="polite">100%</span><button id="zoom-in" class="view-control" type="button" aria-label="放大画布" title="放大">+</button><button id="zoom-fit" class="view-control" type="button" aria-label="适配整个图" title="适配整个图">适配</button><button id="search-toggle" class="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel">搜索节点</button></div></div><div id="search-panel" class="search-panel" hidden><input id="search" aria-label="搜索节点" placeholder="搜索名称或编号…"><div id="index-list"></div></div><div id="graph-viewport" class="graph-viewport"><svg id="graph" viewBox="0 0 1100 680" role="img" aria-label="整体本体类型与关系图"></svg></div><div id="graph-foot" class="graph-foot"></div></section>
<aside id="details" class="details" aria-label="节点详情"></aside></div><footer>本地文件浏览。本体对象关系与物理元数据分开呈现；结构校验不代表业务语义正确。</footer></main>
<script id="result-data" type="application/json">__RESULT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('result-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const O=D.ontology||{},M=D.metadata||{},X=D.association_preview||{links:[]},OV=D.ontology_overview||{nodes:[],inheritance:[],relations:[],omitted_relation_type_ids:[]},types=[...(O.object_roots||[]),...(O.object_types||[])],relations=[...(O.relation_roots||[]),...(O.relation_types||[])],attrs=O.attributes||[];
const T=new Map(types.map(x=>[x.id,x])),R=new Map(relations.map(x=>[x.id,x])),A=new Map(attrs.map(x=>[x.id,x])),TABLE=new Map((M.tables||[]).map(x=>[x.id,x]));
const rootNames={GeneralObject:'一般对象',Measure:'度量',Metric:'指标',Dimension:'维度',Term:'术语'};
const rootOf=x=>{let current=x,seen=new Set();while(current&&current.parent&&!seen.has(current.id)){seen.add(current.id);current=T.get(current.parent)}return current?.id||x?.parent||x?.id};
const typeKind=x=>x?.category==='source_record_type'?'源记录结构':rootNames[rootOf(x)]||'对象类型';
const name=x=>rootNames[x?.id]||x?.label||x?.table_comment||x?.column_name||x?.table_name||x?.constraint_name||x?.id||'未命名';
let mode='ontology',selected=null,tableId=(M.tables||[])[0]?.id||null;
const expandedTables=new Set();
const text=x=>x==null?'—':typeof x==='object'?JSON.stringify(x,null,2):String(x);
const clip=(x,n=19)=>String(x||'').length>n?String(x).slice(0,n-1)+'…':String(x||'');
function el(tag,content,cls){const node=document.createElement(tag);if(content!==undefined)node.textContent=String(content);if(cls)node.className=cls;return node}
function svgEl(tag,attrs={}){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,String(v)));return node}
function field(panel,label,value){if(value===undefined||value===null||value==='')return;panel.append(el('div',label,'label'),el('div',text(value),'value'))}
function button(title,subtitle,fn){const b=el('button',undefined,'item');b.type='button';b.append(el('span',title));if(subtitle)b.append(el('small',subtitle));b.onclick=fn;return b}
function section(panel,title,items,fn,empty='无'){const s=el('section',undefined,'section');s.append(el('h3',`${title} · ${items.length}`));if(items.length)items.forEach(x=>s.append(fn(x)));else s.append(el('p',empty,'empty'));panel.append(s)}
function evidence(panel,item){const ids=item?.evidence_ids||[],s=el('section',undefined,'evidence');s.append(el('h3',`证据 · ${ids.length}`));if(!ids.length)s.append(el('p','没有单独保存证据原文。','empty'));
ids.forEach(id=>{const e=D.evidence?.[id];if(e){const box=el('div',e.raw_fragment||'原文未保存','quote'),src=e.source_ref||{};box.append(el('small',[src.table,src.column,src.row&&`第 ${src.row} 行`,src.document_id].filter(Boolean).join(' · ')||id));s.append(box)}else s.append(el('p',`证据标识：${id}（原文未进入页面预览）`,'plain'))});panel.append(s)}
function select(kind,id){selected={kind,id};if(mode==='metadata'&&kind==='table')tableId=id;$('search-panel').hidden=true;$('search-toggle').setAttribute('aria-expanded','false');renderGraph();renderDetails()}
// Inherited properties retain their declaring type and evidence in details.
function typeAncestors(id){const result=new Set();let current=T.get(id);while(current&&!result.has(current.id)){result.add(current.id);current=T.get(current.parent)}return result}
function objectRels(id){const ancestors=typeAncestors(id);return (O.relation_types||[]).filter(r=>r.category==='business_relation_type'&&[...(r.domain||[]),...(r.range||[])].some(type=>ancestors.has(type)))}
function objectAttrs(id){const ancestors=typeAncestors(id);return attrs.filter(a=>(a.domain||[]).some(type=>ancestors.has(type)))}
function objectInstances(id){const found=new Map();[...(D.objects||[]),...(D.concepts||[])].filter(x=>typeAncestors(x.ontology_type_id||x.type).has(id)).forEach(x=>found.set(x.id,x));return [...found.values()]}
function inheritedFrom(item,id){return (item.domain||[]).includes(id)?'':(item.domain||[]).filter(type=>typeAncestors(id).has(type)).map(type=>name(T.get(type))).join('、')}
function verifiedEquivalentTypes(x){return [...new Set(x.equivalent_type_ids||[])].filter(id=>id!==x.id&&T.has(id)).map(id=>T.get(id))}
function equivalenceEvidence(x){return (O.type_equivalences||[]).filter(a=>a.source_type_id===x.id||a.target_type_id===x.id)}
function mappedRecordType(table,detail){const id=table.source_record_type||detail.record_types?.[0]?.id||`source_record_type:${table.id}`;return T.get(id)||detail.record_types?.find(x=>x.id===id)||null}
function linkLabel(status){return {declared:'声明外键',verified_technical:'已核验技术匹配',observed_subset:'部分命中',candidate:'待核验候选'}[status]||status||'未知'}
$('run-info').textContent=`${D.run_name} · ${D.manifest.input_tables??'—'} 张输入表 · ${D.manifest.input_records??'—'} 条输入记录`;
$('status').textContent={complete:'执行完成',partial:'部分完成',failed:'执行失败'}[D.manifest.status]||'状态未记录';$('status').classList.add(D.manifest.status||'unknown');
function switchMode(next){mode=next;selected=null;$('search').value='';$('search-panel').hidden=true;$('search-toggle').setAttribute('aria-expanded','false');document.querySelectorAll('[data-mode]').forEach(x=>{const active=x.dataset.mode===next;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('search-toggle').onclick=()=>{const open=$('search-panel').hidden;$('search-panel').hidden=!open;$('search-toggle').setAttribute('aria-expanded',String(open));if(open){renderIndex();$('search').focus()}};$('search').oninput=renderIndex;
function renderIndex(){const list=$('index-list'),q=$('search').value.trim().toLowerCase();list.replaceChildren();if($('search-panel').hidden)return;if(!q){list.append(el('p','输入名称或编号后显示匹配结果。','empty'));return}
const groups=mode==='ontology'?[['本体对象',OV.nodes||[],'object'],['对象关系',[...(O.relation_roots||[]),...(O.relation_types||[]).filter(x=>x.category==='business_relation_type')],'relation'],...(q?[['数据属性',attrs,'attribute']]:[])]:[['物理表',M.tables||[],'table']];
for(const [title,items,kind] of groups){const found=items.filter(x=>`${name(x)} ${x.id} ${x.source_column||''} ${x.definition||''}`.toLowerCase().includes(q));if(!found.length)continue;list.append(el('div',`${title} · ${found.length}`,'group-title'));found.forEach(x=>{const b=el('button',undefined,'index-item');b.type='button';b.classList.toggle('active',selected?.kind===kind&&selected.id===x.id);b.append(el('span',name(x)));if(kind==='attribute')b.append(el('small',x.source_table||x.id));b.onclick=()=>select(kind,x.id);list.append(b)})}if(!list.childNodes.length)list.append(el('p','没有匹配的节点','empty'))}
function renderDetails(){const p=$('details'),point=selected;p.replaceChildren();if(!point?.id){p.append(el('h2',mode==='ontology'?'整体本体结构':'元数据图'));p.append(el('p',mode==='ontology'?'点击对象节点或关系连线，查看属性、关系、实例和证据。':'点击物理表或声明外键，查看元数据和来源。','empty'));return}
if(mode==='ontology'){
if(point.kind==='object'){const x=T.get(point.id);if(!x)return;const children=(O.object_types||[]).filter(y=>y.parent===x.id),as=objectAttrs(x.id),rs=objectRels(x.id),samples=objectInstances(x.id);
p.append(el('h2',name(x)),el('span',typeKind(x),'kind'),el('div',x.id,'id'));field(p,'定义',x.definition);if(x.parent)field(p,'上位类型',name(T.get(x.parent))||x.parent);field(p,'适用范围',Object.keys(x.applicability_scope||{}).length?x.applicability_scope:undefined);field(p,'单位',x.unit);field(p,'计算运算',x.aggregation_operator);
if(x.category==='business_type'&&(x.canonical_type_id||x.equivalent_type_ids?.length)){
const canonical=T.get(x.canonical_type_id||x.id),equivalents=verifiedEquivalentTypes(x),judgements=equivalenceEvidence(x);
section(p,'规范类型',canonical?[canonical]:[],y=>button(name(y),y.id,()=>select('object',y.id)),'规范类型未进入页面预览');
section(p,'已验证等价来源类型',equivalents,y=>button(name(y),y.id,()=>select('object',y.id)),'没有其他已验证等价类型');
if(judgements.length)section(p,'等价判定依据',judgements,y=>{const card=el('div',undefined,'quote');card.append(el('div',`${name(T.get(y.source_type_id))} ↔ ${name(T.get(y.target_type_id))}`));if(y.semantic_equivalence_explanation)card.append(el('div',y.semantic_equivalence_explanation,'plain'));[['来源定义',y.source_description_quote],['目标定义',y.target_description_quote],['来源公式',y.source_formula_quote],['目标公式',y.target_formula_quote]].forEach(([label,value])=>{if(value)card.append(el('div',`${label}：${clip(value,400)}`,'plain'))});card.append(el('small',`${(y.evidence_ids||[]).length} 条来源证据 · ${y.id}`));return card});
}
section(p,'下位类型',children,y=>button(name(y),y.id,()=>select('object',y.id)));
section(p,'数据属性',as,y=>button(y.label||y.source_column||y.id,`${y.literal_type||'未知类型'} · ${inheritedFrom(y,x.id)?'继承自 '+inheritedFrom(y,x.id)+' · ':''}${y.mapping_status==='definition_record_only'?'仅定义记录':y.source_table||'来源未记录'}`,()=>select('attribute',y.id)),x.category==='business_type'?'尚未构建该对象的数据属性映射':'没有映射的数据属性');
if(x.category==='business_type'&&(x.source_properties||[]).length)section(p,'定义来源字段',x.source_properties,y=>el('p',`${y.role||'字段'} · ${y.source_table||y.table||'—'}.${y.source_column||y.column||'—'}（仅支持类型定义）`,'plain'));
section(p,'对象属性与连接',rs,y=>{const ancestors=typeAncestors(x.id),out=(y.domain||[]).some(id=>ancestors.has(id)),others=out?y.range||[]:y.domain||[];return button(name(y),`${out?'指向':'来自'} ${others.map(id=>name(T.get(id))||id).join('、')||'端点未确定'} · ${inheritedFrom(y,x.id)?'继承自 '+inheritedFrom(y,x.id)+' · ':''}${y.parent||'未分类'}`,()=>select('relation',y.id))},'尚无已接受对象关系');
const computations=(O.calculations||[]).filter(y=>y.source_type_id===x.id);
if(computations.length)section(p,'计算定义',computations,y=>{const box=el('div',undefined,'quote');field(box,'原式',y.raw_formula);field(box,'绑定状态',y.status);if(y.reason)field(box,'未决原因',y.reason);for(const operand of y.bindings||[])box.append(button(`${operand.symbol} · ${operand.operand_role}`,operand.target_type_id?name(T.get(operand.target_type_id)):operand.reason||'未绑定',()=>operand.target_type_id&&select('object',operand.target_type_id)));evidence(box,y);return box});
const membershipCount=(D.definition_membership_counts||{})[x.id]||0,members=(D.definition_memberships||[]).filter(y=>y.type_id===x.id);
if(membershipCount){section(p,`同定义类型的源记录 · 共 ${membershipCount} 条`,members,y=>button(`${y.table} · 第 ${y.row_number} 行`,y.record_id,()=>select('definition_membership',y.id)));p.append(el('p','此处保留各记录身份，仅复用定义类型。引用差异须单独核验。','empty'))}
section(p,'实例预览',samples.slice(0,8),y=>button(name(y),y.id,()=>select('instance',y.id)),'当前页面没有此类型的实例预览');if(samples.length>8)p.append(el('p',`另有 ${samples.length-8} 条已载入实例未列出。`,'empty'));
if(x.category==='source_record_type'){const sourceTable=x.id.replace(/^source_record_type:/,'');if(TABLE.has(sourceTable))section(p,'物理来源',[TABLE.get(sourceTable)],y=>button(name(y),y.id,()=>{tableId=y.id;switchMode('metadata')}))}

      if(group.root)nodes.push(node(group.root.id,name(group.root),typeKind(group.root),center,rowY+45,()=>select('object',group.root.id),selected?.kind==='object'&&selected.id===group.root.id,'一级对象',rootId));
      let levelY=rowY+150;
      for(const depth of [...levels.keys()].sort((a,b)=>a-b)){
        const items=levels.get(depth).sort((a,b)=>a.id.localeCompare(b.id));
        items.forEach((x,index)=>{
          const col=index%2,row=Math.floor(index/2),xx=x0+85+col*166,yy=levelY+row*100;
          nodes.push(node(x.id,name(x),typeKind(x),xx,yy,()=>select('object',x.id),selected?.kind==='object'&&selected.id===x.id,`派生层级 ${depth}`,rootId))
        });
        levelY+=Math.ceil(items.length/2)*100+20
      }
      rowHeight=Math.max(rowHeight,Math.max(145,levelY-rowY-15))
    });
    rowY+=rowHeight+gapY
  }
  (OV.inheritance||[]).forEach(e=>edges.push({from:e.source,to:e.target,kind:'inheritance',label:'派生自'}));
  (OV.relations||[]).forEach(e=>edges.push({id:e.id,from:e.source,to:e.target,kind:'relation',label:e.label,action:()=>select('relation',e.id)}));
  $('graph-title').textContent='整体本体结构';
  $('graph-subtitle').textContent=`${visible.length} 个对象类型 · ${OV.inheritance?.length||0} 条继承边 · ${OV.relations?.length||0} 条有明确端点的对象关系。点击节点或关系查看详情。`;
  $('graph-foot').textContent=`数据属性、实例和证据在右侧详情；源行结构留在元数据模式。另有 ${OV.omitted_relation_type_ids?.length||0} 个关系类型未画成端点连线，因为端点未确定或涉及源行结构。`;
  drawGraph(nodes,edges)
}
// Layout depends on checked graph topology, not business names or file order.
function tableLabelLines(value){
  const chars=[...String(value||'')],lines=[];let line='',width=0;
  for(const char of chars){const next=/[\u2e80-\u9fff]/u.test(char)?11:6;if(width+next>68){lines.push(line);line='';width=0;if(lines.length===2){lines[1]=lines[1].slice(0,-1)+'…';return lines}}line+=char;width+=next}
  if(line)lines.push(line);return lines.slice(0,2)
}
function metadataPositions(tables,links,focus=null,focusRadius=225){
  const ids=new Set(tables.map(t=>t.id)),degree=new Map(tables.map(t=>[t.id,0])),pairs=new Map();
  links.forEach(e=>{if(e.source===e.target||!ids.has(e.source)||!ids.has(e.target))return;const key=[e.source,e.target].sort().join('|');if(!pairs.has(key)){pairs.set(key,e);degree.set(e.source,degree.get(e.source)+1);degree.set(e.target,degree.get(e.target)+1)}});
  const order=[...tables].sort((a,b)=>degree.get(b.id)-degree.get(a.id)||a.id.localeCompare(b.id));
  if(focus&&ids.has(focus)){const rest=order.filter(t=>t.id!==focus),radius=Math.max(focusRadius,rest.length*26),out=new Map([[focus,{x:0,y:0}]]);rest.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/rest.length;out.set(t.id,{x:radius*Math.cos(a),y:radius*Math.sin(a)})});return out}
  const points=order.map((t,i)=>({id:t.id,x:Math.cos(i*2.399963)*Math.sqrt(i)*145,y:Math.sin(i*2.399963)*Math.sqrt(i)*145})),byId=new Map(points.map(p=>[p.id,p]));
  // Bound browser work for large previews; still place every visible table.
  if(points.length>120)return new Map(points.map(p=>[p.id,{x:p.x,y:p.y}]));
  for(let step=0;step<220;step++){
    const force=new Map(points.map(p=>[p.id,{x:-p.x*.0015,y:-p.y*.0015}]));
    for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++){const a=points[i],b=points[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),power=11000/(d*d)+Math.max(0,155-d)*.22,fx=dx/d*power,fy=dy/d*power;force.get(a.id).x-=fx;force.get(a.id).y-=fy;force.get(b.id).x+=fx;force.get(b.id).y+=fy}
    for(const e of pairs.values()){const a=byId.get(e.source),b=byId.get(e.target),dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),power=(d-195)*.008,fx=dx/d*power,fy=dy/d*power;force.get(a.id).x+=fx;force.get(a.id).y+=fy;force.get(b.id).x-=fx;force.get(b.id).y-=fy}
    for(const p of points){const f=force.get(p.id),length=Math.max(1,Math.hypot(f.x,f.y)),speed=Math.min(5,Math.max(.4,(220-step)/35));p.x+=f.x/length*Math.min(length,speed);p.y+=f.y/length*Math.min(length,speed)}
  }
  return new Map(points.map(p=>[p.id,{x:p.x,y:p.y}]))
}
let metadataLinkGroups=new Map();
function metadataGraph(){
  const allTables=M.tables||[],nodes=[],edges=[];
  const focus=selected&&['table','column','technical_link','table_link_group','metadata_record_type'].includes(selected.kind)?tableId:null;
  const allLinks=(M.links||[]).filter(x=>TABLE.has(x.source)&&TABLE.has(x.target));
  const visibleLinks=allLinks.filter(x=>!focus||x.source===focus||x.target===focus);
  const neighborIds=new Set([focus,...visibleLinks.flatMap(x=>[x.source,x.target])]);
  const tables=focus?allTables.filter(t=>neighborIds.has(t.id)):allTables;
  const focusColumns=expandedTables.has(focus)?(M.details?.[focus]?.columns?.length||0):0;
  const positions=metadataPositions(tables,visibleLinks,focus,focusColumns?210+Math.ceil(focusColumns/10)*110:225);
  for(const t of tables){const pos=positions.get(t.id),detail=M.details?.[t.id]||{},columns=expandedTables.has(t.id)?detail.columns||[]:[];
    nodes.push(node(t.id,name(t),'物理表',pos.x,pos.y,()=>select('table',t.id),selected?.kind==='table'&&selected.id===t.id,t.table_name||t.id));
    columns.forEach((column,i)=>{const angle=-Math.PI/2+2*Math.PI*(i%10)/Math.min(10,columns.length),radius=130+Math.floor(i/10)*110,x=pos.x+Math.cos(angle)*radius,y=pos.y+Math.sin(angle)*radius;
      nodes.push(node(column.id,name(column),'字段',x,y,()=>{tableId=t.id;select('column',column.id)},selected?.kind==='column'&&selected.id===column.id,column.column_comment||column.data_type||''));
      edges.push({from:t.id,to:column.id,kind:'table_has_column',label:'含字段',showLabel:false,quiet:true});
    });
  }
  const visibleNodeIds=new Set(nodes.map(x=>x.id));metadataLinkGroups=new Map();
  for(const link of visibleLinks){
    const from=visibleNodeIds.has(link.source_column_id)?link.source_column_id:link.source,to=visibleNodeIds.has(link.target_column_id)?link.target_column_id:link.target;
    if(from===link.source&&to===link.target){
      const key='table_pair:'+([from,to].sort().join(':')),group=metadataLinkGroups.get(key)||{id:key,source:from,target:to,links:[]};group.links.push(link);metadataLinkGroups.set(key,group);
    }else edges.push({id:link.id,from,to,kind:link.status==='declared'?'declared':'technical_link',status:link.status,label:`${link.source_field||'?'} → ${link.target_field||'?'}`,showLabel:!!focus,action:()=>{tableId=link.source;select('technical_link',link.id)}});
  }
  const important=new Set([...metadataLinkGroups.values()].sort((a,b)=>b.links.length-a.links.length||a.id.localeCompare(b.id)).filter(g=>g.links.length>=3).slice(0,4).map(g=>g.id));
  for(const group of metadataLinkGroups.values()){
    const declared=group.links.every(x=>x.status==='declared'),subset=group.links.every(x=>x.status==='observed_subset');group.bidirectional=group.links.some(x=>x.source===group.target&&x.target===group.source);
    const prominent=!!focus||declared||important.has(group.id);
    edges.push({id:group.id,from:group.source,to:group.target,kind:declared?'declared':'technical_link',status:declared?'declared':subset?'observed_subset':'verified_technical',bidirectional:group.bidirectional,label:`${group.links.length} ${declared?'声明外键':'字段关联'}`,showLabel:prominent,quiet:!prominent,action:()=>{tableId=group.source;select('table_link_group',group.id)}});
  }
  $('graph-title').textContent=focus?'元数据图 · 关联邻域':'元数据图';
  $('graph-subtitle').textContent=`${tables.length} / ${allTables.length} 张表 · ${visibleLinks.length} 条字段关联，合并为 ${metadataLinkGroups.size} 组表间连接。点击表聚焦，悬停节点或连线查看关系。`;
  $('graph-foot').textContent=`绿色为声明外键，蓝色为技术匹配，棕色为部分命中。双箭头表示两个方向均有字段关联，具体条件见右侧。${focus?`当前聚焦 ${name(TABLE.get(focus))}，右侧可恢复全图。`:'默认仅显示主要连线标签，所有细线仍可点击。'}${M.total_tables>allTables.length?'页面仅显示部分表。':''}`;
  drawGraph(nodes,edges)
}
