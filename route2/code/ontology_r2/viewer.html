12px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.body{grid-template-columns:minmax(0,1fr) 290px}main{padding:18px}}@media(max-width:700px){header{padding:22px}.body{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #ddd}.tabs{flex-wrap:wrap}input{width:100%}.metrics{gap:7px}.metric{padding:12px}.metric strong{font-size:22px}}

<body><header><div><div class="eyebrow">ONTOLOGY / EXPLORER</div><h1>本体 · 结果浏览</h1><p id="run-name"></p></div><span id="status" class="badge"></span></header>
<main><section class="metrics" id="metrics"></section><section class="workspace"><div class="toolbar"><nav class="tabs" aria-label="结果视图"><button data-mode="instances">记录关系</button><button data-mode="business_relations">业务类型关系</button><button data-mode="concepts">业务概念</button><button data-mode="alignments">记录对齐</button><button data-mode="types">本体类型</button><button data-mode="metadata" class="active">元数据</button><button data-mode="steps">构建增量</button><button data-mode="group_steps">语义组增量</button><button data-mode="knowledge">补充知识</button><button data-mode="unresolved">未决项</button></nav><input id="search" aria-label="搜索结果" placeholder="搜索名称、关系或来源…"></div><div id="type-filter" class="type-filter" hidden><span>类型分组</span><button data-type-filter="business" class="active">业务派生类型</button><button data-type-filter="source_record">源记录类型</button><button data-type-filter="unclassified">未分类类型</button><button data-type-filter="record_relation">记录关系类型</button><button data-type-filter="business_relation">业务关系类型</button></div><div class="body"><div><div id="canvas" class="canvas"><svg id="graph" viewBox="0 0 900 530" aria-label="抽取结果关系图"></svg><div class="tools"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="reset" aria-label="重置">↺</button></div><div class="legend"><i></i>点击节点或连线查看证据 · 滚轮缩放</div></div><div id="listing" class="listing" hidden></div><div id="metadata-view" class="metadata-view" hidden></div></div><aside id="details"><h2>查看一条关系的依据</h2><p class="muted">点击节点或连线，查看源记录、适用范围和证据原文。业务概念与记录对齐在各自视图中显示。</p></aside></div><div id="scope" class="foot"></div></section><footer><span>本地浏览 · 页面不向外部服务发送数据</span><span>结构校验通过不代表业务语义已验证</span></footer></main>
<script id="result-data" type="application/json">__RESULT_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('result-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const statusNames={complete:'执行完成',partial:'部分完成',failed:'执行失败',accepted:'已接受',rejected:'已拒绝',budget_exhausted:'预算耗尽',useful:'有可用知识',no_evidence:'无补充知识',conflict:'存在冲突',error:'检索错误',unavailable:'服务不可用',missing_target:'未找到目标',ambiguous_identity:'目标不唯一',condition_unknown:'适用条件不明确',semantic_increment_not_accepted:'语义增量未接受',unsupported_value:'无法解释的字段值',no_change:'未产生增量',unresolved:'未决',exact:'精确',narrower:'下位',related:'相关'};
let mode='metadata',selectedTable=null,edgeFilter='all',typeFilter='business',scale=1,pan={x:0,y:0},graphGroup,viewWidth=900;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function svgEl(tag,attrs){const n=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));return n}
$('run-name').textContent=D.run_name+' · '+(D.manifest.synthetic?'模拟数据':'输入数据')+' · '+(D.manifest.input_tables||0)+' 张表';
$('status').textContent=statusNames[D.manifest.status]||'状态未知';$('status').classList.add(D.manifest.status||'');
D.preview.metrics.forEach(({label,value})=>{const box=el('div',undefined,'metric');box.append(el('span',label),el('strong',value===null?'—':value.toLocaleString()));$('metrics').append(box)});
if(D.preview.notice)$('metrics').after(el('p',D.preview.notice,'scope-note'));
function show(item,title){const panel=$('details'),endpointLabels=item.viewer_endpoint_labels||['源表','目标表'];panel.replaceChildren(el('h2',title||item.label||item.id||item.unit||'详情'));
for(const [label,key] of [['标识','id'],['定义','definition'],['类型分组','category'],['本体层级','ontology_level'],['业务类型标识','ontology_type_id'],['适用范围','applicability_scope'],['观察坐标','observation_coordinates'],['单位','unit'],['关系定义域','domain'],['关系值域','range'],['端点依据','endpoint_basis'],['证据范围','evidence_scope'],['见证记录对','source_record_pair'],['表说明','table_comment'],['观察记录数','observed_rows'],[endpointLabels[0],'source'],['源字段','source_field'],[endpointLabels[1],'target'],['目标字段','target_field'],['核验结果','verification'],['语义状态','semantic_relation'],['召回通道','retrieval_channels'],['上位类型','parent'],['类型','type'],['对象类型','object_type'],['关系','predicate'],['对齐类型','mapping_kind'],['源记录 ID','source_record_id'],['目标概念 ID','concept_id'],['身份范围','identity_scope'],['接受依据','decision'],['状态','status'],['未决原因','reason'],['来源','source_ref'],['源记录引用','source_refs'],['引用总数','preview_source_ref_count'],['适用条件','scope'],['处理范围','context'],['本次增量','changes'],['构建前','core_before'],['构建后','core_after'],['证据 ID','evidence_ids'],['证据总数','preview_evidence_count']])if(item[key]!==undefined){panel.append(el('div',label,'detail-label'),el('div',typeof item[key]==='object'?JSON.stringify(item[key],null,2):(statusNames[item[key]]||String(item[key])),'value'))}
if(item.preview_attributes?.length){panel.append(el('div',`记录属性 · ${item.preview_attributes.length}/${item.preview_attribute_count||item.preview_attributes.length}`,'detail-label'));item.preview_attributes.forEach(a=>{panel.append(el('div',a.column+(a.literal_type?' · '+a.literal_type:''),'detail-label'),el('div',a.value+(a.truncated?'…':''),'value'))})}
let evidence=(item.evidence_ids||[]).map(id=>D.evidence[id]).filter(Boolean);if(item.claims)evidence=item.claims.map(c=>({raw_fragment:c.quote,source_ref:{document_id:c.document_id,version:c.version},scope:c.scope}));
if(evidence.length){panel.append(el('div','证据原文 · '+evidence.length+' 条','detail-label'));evidence.forEach(e=>{const q=el('div',e.raw_fragment||'原文见源记录','quote');q.append(el('div',(e.source_ref?.table ? e.source_ref.table+(e.source_ref.column?'.'+e.source_ref.column:'')+(e.source_ref.row?' · 第 '+e.source_ref.row+' 行':'') : (e.source_ref?.document_id||'')+(e.source_ref?.version?' · 版本 '+e.source_ref.version:''))+(e.scope?' · '+e.scope:''),'muted'));panel.append(q)})}else panel.append(el('p','此项为结构或过程信息。完整内容见下方记录。','muted'));
const raw=el('details');raw.append(el('summary','完整记录'),el('pre',JSON.stringify(item,null,2)));panel.append(raw)}
function graphData(){if(mode==='instances'||mode==='business_relations'){
  const layer=mode==='instances'?'record':'business_type';
  const names=new Map((D.ontology.relation_types||[]).map(item=>[item.id,item.label||item.id]));
  const edges=D.relations.filter(edge=>edge.viewer_layer===layer).map(edge=>({...edge,source:edge.subject,target:edge.object,label:names.get(edge.predicate)||edge.predicate}));
  const ids=new Set(edges.flatMap(edge=>[edge.source,edge.target]));
  const nodes=D.objects.filter(object=>ids.has(object.id)).map(object=>({...object,label:object.label||object.id.split(':').pop().slice(0,9),group:object.source_ref?.table||object.type}));
  return {nodes,edges,total:nodes.length}}
const onto=D.ontology,objects=onto.object_types||[],nodes=[];
if(typeFilter==='record_relation'||typeFilter==='business_relation'){
  nodes.push(...(onto.relation_roots||[]).map(n=>({...n,group:'根关系类型'})));
  const selected=(onto.relation_types||[]).filter(n=>typeFilter==='business_relation'?n.category==='business_relation_type':n.category!=='business_relation_type');
  nodes.push(...selected.map(n=>({...n,label:n.label||n.id,group:typeFilter==='business_relation'?'业务关系类型':'记录关系类型'})));
}else{
  nodes.push(...(onto.object_roots||[]).map(n=>({...n,group:'根对象类型'})));
  const category={business:'business_type',source_record:'source_record_type'}[typeFilter];
  const selected=objects.filter(n=>category?n.category===category:!['business_type','source_record_type'].includes(n.category));
  const group={business:'业务派生类型',source_record:'源记录类型',unclassified:'未分类类型'}[typeFilter];
  nodes.push(...selected.map(n=>({...n,label:n.label||n.id,group})));
}
const edges=nodes.filter(n=>n.parent).map(n=>({source:n.id,target:n.parent,label:'派生自',...n}));
return {nodes:nodes.slice(0,D.limit),edges,total:nodes.length}}
function transform(){if(graphGroup)graphGroup.setAttribute('transform',`translate(${viewWidth/2+pan.x},${265+pan.y}) scale(${scale}) translate(${-viewWidth/2},-265)`)}
function renderMetadata(q){
  const view=$('metadata-view'),meta=D.metadata,byId=new Map(meta.tables.map(table=>[table.id,table]));
  const names={declared:'声明外键',verified_technical:'技术匹配已验证',candidate:'字段候选'};
  view.replaceChildren();
  if(!selectedTable||!byId.has(selectedTable)){
    selectedTable=null;
    const head=el('div',undefined,'metadata-head');head.append(el('h2','物理表总览'));
    view.append(head,el('p','此处只展示输入表。字段、来源及跨表连接在选择一张表后展开；技术匹配不等于业务关系。','metadata-note'));
    const grid=el('div',undefined,'table-grid');
    const tables=meta.tables.filter(table=>JSON.stringify(table).toLowerCase().includes(q));
    tables.forEach(table=>{const info=meta.details[table.id]||{},card=el('button',undefined,'table-card');
      card.append(el('strong',table.table_name||table.id),el('small',`${info.total_columns??info.columns?.length??0} 个字段 · ${table.observed_rows??'—'} 条输入记录`));
      if(table.table_comment)card.append(el('small',table.table_comment));
      card.onclick=()=>{selectedTable=table.id;$('search').value='';render()};grid.append(card)});
    view.append(grid);if(!tables.length)view.append(el('div','没有匹配的物理表','empty'));
    $('scope').textContent=`显示 ${tables.length} 张表 / 输入共 ${meta.total_tables} 张；这里没有把字段或来源文件当作业务关系。`;
    $('details').replaceChildren(el('h2','选择一张表'),el('p','选择表后可查看字段注释、来源文件，以及与该表相连的声明外键、已验证技术匹配和字段候选。','muted'));
    return;
  }
  const table=byId.get(selectedTable),detail=meta.details[selectedTable]||{columns:[],constraints:[],sources:[]};
  const head=el('div',undefined,'metadata-head'),back=el('button','← 全部表');back.onclick=()=>{selectedTable=null;render()};
  head.append(back,el('h2',table.table_name||table.id));view.append(head);
  view.append(el('p',`${table.table_comment||'无表注释'} · ${table.observed_rows??'—'} 条输入记录。以下连接按证据状态区分；已验证仅表示技术匹配。`,'metadata-note'));
  const filter=el('div',undefined,'metadata-filter'),select=el('select');
  for(const [value,label] of [['all','全部连接'],['declared','声明外键'],['verified_technical','技术匹配已验证'],['candidate','字段候选']]){
    const option=el('option',label);option.value=value;select.append(option)}
  select.value=edgeFilter;select.setAttribute('aria-label','筛选连接状态');select.onchange=()=>{edgeFilter=select.value;render()};
  filter.append(el('span','连接状态'),select);view.append(filter);
  const connected=meta.links.filter(link=>(link.source===selectedTable||link.target===selectedTable)&&
    (edgeFilter==='all'||link.status===edgeFilter)&&(!q||JSON.stringify(link).toLowerCase().includes(q)));
  const list=el('div',undefined,'link-list');
  connected.slice(0,40).forEach(link=>{const row=el('button',undefined,'metadata-link');
    const description=el('div');description.append(el('strong',`${link.source}.${link.source_field||'?'} → ${link.target}.${link.target_field||'?'}`));
    const qualifiers=[];if(Object.keys(link.selector||{}).length)qualifiers.push('条件 '+JSON.stringify(link.selector));
    if(Object.keys(link.scope_bindings||{}).length)qualifiers.push('作用域 '+JSON.stringify(link.scope_bindings));
    if(link.retrieval_channels?.length)qualifiers.push('召回 '+link.retrieval_channels.join('、'));
    if(qualifiers.length)description.append(el('small',qualifiers.join(' · ')));
    row.append(description,el('span',names[link.status]||link.status,'link-status '+link.status));
    row.onclick=()=>show(link,`${link.source_field||'?'} → ${link.target_field||'?'}`);list.append(row)});
  view.append(list);
  if(!connected.length)view.append(el('div','当前条件下没有跨表连接。没有连接不等于不存在业务关联。','empty'));
  if(connected.length>40)view.append(el('p',`此表有 ${connected.length} 条匹配连接，当前只显示前 40 条；可用搜索和状态筛选缩小范围。`,'metadata-note'));
  const panel=$('details');show(table,table.table_name||table.id);
  const addItems=(label,items,total,format)=>{panel.append(el('div',`${label} · ${items.length}/${total}`,'detail-label'));const list=el('ul',undefined,'detail-list');
    items.forEach(item=>list.append(el('li',format(item))));panel.append(list)};
  addItems('字段',detail.columns||[],detail.total_columns??0,item=>`${item.column_name}${item.column_comment?' · '+item.column_comment:''}`);
  addItems('来源文件',detail.sources||[],detail.total_sources??0,item=>item.path||item.id);
  addItems('约束',detail.constraints||[],detail.total_constraints??0,item=>item.constraint_name||item.definition||item.id);
  $('scope').textContent=`${table.id}：${connected.length} 条当前过滤的连接；全局已声明 ${meta.link_counts.declared}、技术已验证 ${meta.link_counts.verified_technical}、候选 ${meta.link_counts.candidate}。${meta.total_links>meta.shown_links?'页面连接预览有截断，完整记录见运行目录。':''}`;
}
function render(){const q=$('search').value.toLowerCase().trim(),typeData=mode==='types'?graphData():null;
const typeList=mode==='types'&&(D.preview.type_counts?.[typeFilter]||0)>12;
const isList=typeList||['concepts','alignments','steps','group_steps','knowledge','unresolved'].includes(mode);
$('canvas').hidden=isList||mode==='metadata';$('listing').hidden=!isList;$('metadata-view').hidden=mode!=='metadata';$('type-filter').hidden=mode!=='types';document.querySelectorAll('[data-type-filter]').forEach(button=>{button.classList.toggle('active',button.dataset.typeFilter===typeFilter);button.setAttribute('aria-pressed',String(button.dataset.typeFilter===typeFilter))});if(mode==='metadata'){renderMetadata(q);return}
if(typeList){const items=typeData.nodes.filter(item=>item.parent&&JSON.stringify(item).toLowerCase().includes(q));
  const list=$('listing');list.replaceChildren(el('p','该分组类型较多，按源类型及上位类型列出；点击查看定义和证据。','metadata-note'));
  items.forEach(item=>{const row=el('button',undefined,'row'),name=item.label||item.id,description=el('div',name);
    description.append(el('small',`${item.id} · 上位类型 ${item.parent}`));
