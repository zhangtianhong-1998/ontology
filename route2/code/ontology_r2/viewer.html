<script>

function node(id,label,kind,x,y,action,active=false,subtitle='',root=''){return{id,label,kind,x,y,action,active,subtitle,root}}
function drawGraph(nodes,edges,width=1100,height=680){
  const svg=$('graph'),actualWidth=Math.max(width,svg.parentElement.clientWidth||0),actualHeight=Math.max(height,520);
  svg.style.width=`${actualWidth}px`;svg.style.height=`${actualHeight}px`;svg.setAttribute('viewBox',`0 0 ${actualWidth} ${actualHeight}`);svg.replaceChildren();
  const defs=svgEl('defs'),marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});
  marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#8797aa'}));defs.append(marker);svg.append(defs);
  const map=new Map(nodes.map(x=>[x.id,x]));
  edges.forEach(e=>{
    const a=map.get(e.from),b=map.get(e.to);if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y,vertical=Math.abs(dy)>=Math.abs(dx),sx=a.x+(vertical?0:Math.sign(dx)*94),sy=a.y+(vertical?Math.sign(dy)*29:0),tx=b.x-(vertical?0:Math.sign(dx)*94),ty=b.y-(vertical?Math.sign(dy)*29:0);
    const relation=e.kind==='relation',self=a.id===b.id,cx=(sx+tx)/2,cy=(sy+ty)/2-(relation?48:0);
    const path=self?`M ${a.x+75} ${a.y-20} C ${a.x+165} ${a.y-115}, ${a.x-95} ${a.y-115}, ${a.x-75} ${a.y-20}`:relation?`M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`:`M ${sx} ${sy} L ${tx} ${ty}`;
    const line=svgEl('path',{d:path,class:`edge ${e.kind||''} ${e.status||''} ${selected?.kind==='relation'&&selected.id===e.id?'selected':''}`,'marker-end':'url(#arrow)'});
    if(e.action){line.setAttribute('role','button');line.setAttribute('tabindex','0');line.setAttribute('aria-label',e.label||e.id);line.onclick=e.action;line.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();e.action()}}}
    const title=svgEl('title');title.textContent=e.label||e.kind||'连接';line.append(title);svg.append(line);
    if(e.label&&(relation||e.kind==='declared')&&edges.length<60){const textNode=svgEl('text',{x:self?a.x:cx,y:self?a.y-100:cy-8,'text-anchor':'middle',class:`edge-label ${e.kind||''}`});textNode.textContent=clip(e.label,16);svg.append(textNode)}
  });
  nodes.forEach(n=>{
    const g=svgEl('g',{class:`node ${n.active?'selected':''}`,role:'button',tabindex:0,'aria-label':`${n.kind}：${n.label}`,'data-node-id':n.id});
    const fill=n.kind==='物理表'?'#e5f0fc':({Metric:'#e4f0fc',Measure:'#e7f4eb',Dimension:'#fff2df',Term:'#f4eafd',GeneralObject:'#e8f0f4'})[n.root]||'#f1f5f8';
    g.append(svgEl('rect',{x:n.x-92,y:n.y-27,width:184,height:54,rx:8,fill}));
    const t=svgEl('text',{x:n.x,y:n.y+1,'text-anchor':'middle'});t.textContent=clip(n.label,19);g.append(t);
    const sub=svgEl('text',{x:n.x,y:n.y+17,'text-anchor':'middle',class:'sub'});sub.textContent=clip(n.subtitle||n.kind,23);g.append(sub);
    const title=svgEl('title');title.textContent=n.label;g.append(title);g.onclick=n.action;g.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();n.action()}};svg.append(g)
  })
}
function ontologyGraph(){
  const visible=OV.nodes||[],rootItems=O.object_roots||[],rootIds=new Set(rootItems.map(x=>x.id));
  const groups=new Map(rootItems.map(x=>[x.id,{root:x,items:[]}]));
  visible.filter(x=>!rootIds.has(x.id)).forEach(x=>{const key=rootOf(x);if(!groups.has(key))groups.set(key,{root:null,items:[]});groups.get(key).items.push(x)});
  const nodes=[],edges=[],depthOf=x=>{let depth=0,current=x,seen=new Set();while(current?.parent&&!seen.has(current.id)){seen.add(current.id);depth++;current=T.get(current.parent)}return Math.max(depth,1)};
  let offset=30,maxY=380;
  for(const [rootId,group] of groups){
    const levels=new Map();group.items.forEach(x=>{const depth=depthOf(x);if(!levels.has(depth))levels.set(depth,[]);levels.get(depth).push(x)});
    const laneWidth=group.items.length?660:245,center=offset+laneWidth/2;
    if(group.root)nodes.push(node(group.root.id,name(group.root),typeKind(group.root),center,65,()=>select('object',group.root.id),selected?.kind==='object'&&selected.id===group.root.id,'一级对象',rootId));
    let y=175;
    for(const depth of [...levels.keys()].sort((a,b)=>a-b)){
      const items=levels.get(depth).sort((a,b)=>a.id.localeCompare(b.id));
      items.forEach((x,index)=>{const col=index%3,row=Math.floor(index/3),xx=offset+laneWidth/2+(col-1)*210,yy=y+row*105;nodes.push(node(x.id,name(x),typeKind(x),xx,yy,()=>select('object',x.id),selected?.kind==='object'&&selected.id===x.id,`派生层级 ${depth}`,rootId));maxY=Math.max(maxY,yy+70)});
      y+=Math.ceil(items.length/3)*105+45;
    }
    offset+=laneWidth+28;
  }
  (OV.inheritance||[]).forEach(e=>edges.push({from:e.source,to:e.target,kind:'inheritance',label:'派生自'}));
  (OV.relations||[]).forEach(e=>edges.push({id:e.id,from:e.source,to:e.target,kind:'relation',label:e.label,action:()=>select('relation',e.id)}));
  $('graph-title').textContent='整体本体结构';
  $('graph-subtitle').textContent=`${visible.length} 个对象类型 · ${OV.inheritance?.length||0} 条继承边 · ${OV.relations?.length||0} 条有明确端点的对象关系。点击节点或关系查看详情。`;
  $('graph-foot').textContent=`数据属性、实例和证据在右侧详情；源行结构留在元数据模式。另有 ${OV.omitted_relation_type_ids?.length||0} 个关系类型未画成端点连线，因为端点未确定或涉及源行结构。`;
  drawGraph(nodes,edges,Math.max(1080,offset+15),maxY+30)
}
