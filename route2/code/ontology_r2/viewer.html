<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本体 · 结果浏览</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1b283d;background:#f3f5f9;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#17263d;color:white;padding:27px 34px;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#a5c5f2;font-size:11px;letter-spacing:2px}h1{font-size:26px;margin:7px 0;font-weight:620}header p{color:#b9c7da;margin:0;font-size:12px}.badge{border:1px solid #7992ae;border-radius:20px;padding:7px 13px;font-size:12px}.badge.partial,.badge.failed{border-color:#edb279;color:#ffe0b6}main{max-width:1600px;margin:auto;padding:24px 30px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{padding:16px 20px;background:white;border:1px solid #e4e9f0;border-radius:10px}.metric strong{font-size:27px;display:block;margin:7px 0 0;font-weight:620;color:#1c467a}.metric span{font-size:12px;color:#5c6b80}.workspace{background:white;border:1px solid #e1e7ef;border-radius:12px;overflow:hidden}.toolbar{padding:16px 18px;border-bottom:1px solid #e9edf3;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:5px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:1px solid #dce3ec;background:white;color:#465771;border-radius:6px;padding:8px 12px}button:hover{background:#f0f5fb}button.active{background:#e9f1ff;color:#174d99;border-color:#bdcff0;font-weight:600}input{border:1px solid #d7dfeb;border-radius:6px;padding:8px 11px;width:240px;outline:none}input:focus,button:focus-visible{outline:2px solid #6f98d3;outline-offset:2px}.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:530px}.canvas{position:relative;min-height:530px;background:radial-gradient(#dce5f0 .7px,transparent .7px);background-size:16px 16px;overflow:hidden}svg{width:100%;height:530px;display:block;touch-action:none}.tools{position:absolute;left:16px;bottom:14px;display:flex;gap:5px}.tools button{width:34px;padding:6px}.legend{position:absolute;right:18px;bottom:21px;font-size:11px;color:#6a7a91}.legend i{display:inline-block;width:7px;height:7px;background:#4e7bc5;border-radius:50%;margin-right:5px}aside{border-left:1px solid #e5eaf0;padding:21px;overflow:auto;max-height:600px}aside h2{font-size:16px;margin:0 0 15px;line-height:1.6;word-break:break-word}.muted{color:#768499;line-height:1.8;font-size:12px}.detail-label{font-size:11px;color:#7a889c;margin:15px 0 5px;text-transform:uppercase;letter-spacing:.4px}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:12px}.quote{padding:10px 12px;border-left:3px solid #91b0df;background:#f2f6fc;margin-top:10px;font-size:12px;line-height:1.8;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#f5f7fa;padding:10px;line-height:1.6}details{margin-top:18px}summary{cursor:pointer;font-size:12px;color:#4d6180}.foot{padding:12px 18px;background:#fafbfd;border-top:1px solid #e9edf3;color:#697c93;font-size:12px;line-height:1.7}.node{cursor:pointer}.node circle{stroke:white;stroke-width:3;filter:drop-shadow(0 2px 3px #173a6624)}.node:hover circle,.node:focus circle{stroke:#183f77;stroke-width:3}.node text{font-size:11px;fill:#32475e}.edge{cursor:pointer;stroke:#90a9ca;stroke-width:1.5;fill:none}.edge:hover{stroke:#225dab;stroke-width:4}.edge-label{font-size:10px;fill:#637894;pointer-events:none}.listing{background:white;min-height:530px;padding:14px;overflow:auto;max-height:600px}.row{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:8px;padding:15px;border-color:#e3e9f1;gap:12px}.row small{color:#77869a;display:block;margin-top:6px}.tag{color:#285c98;background:#edf4ff;padding:4px 7px;border-radius:5px;height:fit-content;font-size:11px;white-space:nowrap}.empty{padding:60px 28px;color:#7a8799;text-align:center;line-height:2}footer{font-size:11px;color:#7b889a;margin-top:16px;display:flex;justify-content:space-between;gap:12px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.body{grid-template-columns:minmax(0,1fr) 290px}main{padding:18px}}@media(max-width:700px){header{padding:22px}.body{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #ddd}.tabs{flex-wrap:wrap}input{width:100%}.metrics{gap:7px}.metric{padding:12px}.metric strong{font-size:22px}}

<body><header><div><div class="eyebrow">ONTOLOGY / EXPLORER</div><h1>本体 · 结果浏览</h1><p id="run-name"></p></div><span id="status" class="badge"></span></header>
<main><section class="metrics" id="metrics"></section><section class="workspace"><div class="toolbar"><nav class="tabs" aria-label="结果视图"><button data-mode="instances" class="active">实例关联</button><button data-mode="concepts">业务概念</button><button data-mode="alignments">记录对齐</button><button data-mode="types">本体类型</button><button data-mode="metadata">元数据</button><button data-mode="steps">构建增量</button><button data-mode="group_steps">语义组增量</button><button data-mode="knowledge">补充知识</button><button data-mode="unresolved">未决项</button></nav><input id="search" aria-label="搜索结果" placeholder="搜索名称、关系或来源…"></div><div class="body"><div><div id="canvas" class="canvas"><svg id="graph" viewBox="0 0 900 530" aria-label="抽取结果关系图"></svg><div class="tools"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="reset" aria-label="重置">↺</button></div><div class="legend"><i></i>点击节点或连线查看证据 · 滚轮缩放</div></div><div id="listing" class="listing" hidden></div></div><aside id="details"><h2>查看一条关系的依据</h2><p class="muted">点击节点或连线，查看源记录、适用范围和证据原文。业务概念与记录对齐在各自视图中显示。</p></aside></div><div id="scope" class="foot"></div></section><footer><span>本地浏览 · 页面不向外部服务发送数据</span><span>结构校验通过不代表业务语义已验证</span></footer></main>
<script id="result-data" type="application/json">__RESULT_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('result-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const statusNames={complete:'执行完成',partial:'部分完成',failed:'执行失败',accepted:'已接受',rejected:'已拒绝',budget_exhausted:'预算耗尽',useful:'有可用知识',no_evidence:'无补充知识',conflict:'存在冲突',error:'检索错误',unavailable:'服务不可用',missing_target:'未找到目标',ambiguous_identity:'目标不唯一',condition_unknown:'适用条件不明确',semantic_increment_not_accepted:'语义增量未接受',unsupported_value:'无法解释的字段值',no_change:'未产生增量',unresolved:'未决',exact:'精确',narrower:'下位',related:'相关'};
let mode='instances',scale=1,pan={x:0,y:0},graphGroup,viewWidth=900;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function svgEl(tag,attrs){const n=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));return n}
$('run-name').textContent=D.run_name+' · '+(D.manifest.synthetic?'模拟数据':'输入数据')+' · '+(D.manifest.input_tables||0)+' 张表';
$('status').textContent=statusNames[D.manifest.status]||'状态未知';$('status').classList.add(D.manifest.status||'');
D.preview.metrics.forEach(({label,value})=>{const box=el('div',undefined,'metric');box.append(el('span',label),el('strong',value===null?'—':value.toLocaleString()));$('metrics').append(box)});
if(D.preview.notice)$('metrics').after(el('p',D.preview.notice,'scope-note'));
function show(item,title){const panel=$('details');panel.replaceChildren(el('h2',title||item.label||item.id||item.unit||'详情'));
for(const [label,key] of [['标识','id'],['定义','definition'],['上位类型','parent'],['类型','type'],['对象类型','object_type'],['关系','predicate'],['对齐类型','mapping_kind'],['源记录 ID','source_record_id'],['目标概念 ID','concept_id'],['身份范围','identity_scope'],['接受依据','decision'],['状态','status'],['未决原因','reason'],['来源','source_ref'],['源记录引用','source_refs'],['引用总数','preview_source_ref_count'],['适用条件','scope'],['处理范围','context'],['本次增量','changes'],['构建前','core_before'],['构建后','core_after'],['证据 ID','evidence_ids'],['证据总数','preview_evidence_count']])if(item[key]!==undefined){panel.append(el('div',label,'detail-label'),el('div',typeof item[key]==='object'?JSON.stringify(item[key],null,2):(statusNames[item[key]]||String(item[key])),'value'))}
if(item.preview_attributes?.length){panel.append(el('div',`记录属性 · ${item.preview_attributes.length}/${item.preview_attribute_count||item.preview_attributes.length}`,'detail-label'));item.preview_attributes.forEach(a=>{panel.append(el('div',a.column+(a.literal_type?' · '+a.literal_type:''),'detail-label'),el('div',a.value+(a.truncated?'…':''),'value'))})}
let evidence=(item.evidence_ids||[]).map(id=>D.evidence[id]).filter(Boolean);if(item.claims)evidence=item.claims.map(c=>({raw_fragment:c.quote,source_ref:{document_id:c.document_id,version:c.version},scope:c.scope}));
if(evidence.length){panel.append(el('div','证据原文 · '+evidence.length+' 条','detail-label'));evidence.forEach(e=>{const q=el('div',e.raw_fragment||'原文见源记录','quote');q.append(el('div',(e.source_ref?.table ? e.source_ref.table+(e.source_ref.column?'.'+e.source_ref.column:'')+(e.source_ref.row?' · 第 '+e.source_ref.row+' 行':'') : (e.source_ref?.document_id||'')+(e.source_ref?.version?' · 版本 '+e.source_ref.version:''))+(e.scope?' · '+e.scope:''),'muted'));panel.append(q)})}else panel.append(el('p','此项为结构或过程信息。完整内容见下方记录。','muted'));
const raw=el('details');raw.append(el('summary','完整记录'),el('pre',JSON.stringify(item,null,2)));panel.append(raw)}
function graphData(){if(mode==='instances')return {nodes:D.objects.map(o=>({...o,label:o.label||o.id.split(':').pop().slice(0,9),group:o.source_ref?.table||o.object_type})),edges:D.relations.map(e=>({...e,source:e.subject,target:e.object,label:e.predicate})),total:D.counts.objects||0};if(mode==='metadata')return {nodes:D.metadata.nodes.map(o=>({...o,label:o.column_name||o.table_name||o.kind,group:o.kind})),edges:D.metadata.edges.map(e=>({...e,label:e.type})),total:D.metadata.total_nodes};
const onto=D.ontology,nodes=[...(onto.object_roots||[]).map(n=>({...n,group:'根对象类型'})),...(onto.object_types||[]).map(n=>({...n,label:n.id,group:'派生对象类型'})),...(onto.relation_roots||[]).map(n=>({...n,group:'根关系类型'})),...(onto.relation_types||[]).map(n=>({...n,label:n.id,group:'派生关系类型'}))];const edges=nodes.filter(n=>n.parent).map(n=>({source:n.id,target:n.parent,label:'派生自',...n}));return {nodes:nodes.slice(0,D.limit),edges,total:nodes.length}}
function transform(){if(graphGroup)graphGroup.setAttribute('transform',`translate(${viewWidth/2+pan.x},${265+pan.y}) scale(${scale}) translate(${-viewWidth/2},-265)`)}
function render(){const q=$('search').value.toLowerCase().trim(),isList=['concepts','alignments','steps','group_steps','knowledge','unresolved'].includes(mode);$('canvas').hidden=isList;$('listing').hidden=!isList;
if(isList){let items=mode==='concepts'?D.concepts:mode==='alignments'?D.record_alignments:mode==='steps'?(D.construction.steps||[]):mode==='group_steps'?(D.construction.group_steps||[]):mode==='knowledge'?D.knowledge:D.unresolved;items=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('listing').replaceChildren();items.forEach((item,i)=>{const title=mode==='concepts'?(item.label||item.id):mode==='alignments'?`${item.source_record_id} → ${D.concepts.find(c=>c.id===item.concept_id)?.label||item.concept_id}`:mode==='steps'?String(item.index+1).padStart(2,'0')+' · '+item.unit:mode==='group_steps'?item.task_kind+' · '+item.bundle_id:mode==='knowledge'?item.unit:(statusNames[item.reason]||item.reason||item.id);const b=el('button',undefined,'row');const info=mode==='concepts'?item.id+' · '+item.type:mode==='alignments'?item.concept_id+' · '+(statusNames[item.mapping_kind]||item.mapping_kind):mode==='steps'?'尝试 '+item.attempts.length+' 次':mode==='group_steps'?(item.concept_id||item.relation_plan_id||item.reason||'未产生增量'):mode==='knowledge'?(item.claims?.length||0)+' 条知识 · '+(item.tool_calls||0)+' 次工具调用':JSON.stringify(item.source_ref||item.table||item.plan_id||'');const note=el('div',title);note.append(el('small',info));b.append(note,el('span',statusNames[item.status]||item.status||statusNames[item.mapping_kind]||item.mapping_kind||'已接受','tag'));b.onclick=()=>show(item,title);$('listing').append(b)});if(!items.length)$('listing').append(el('div','当前视图没有匹配记录','empty'));const total=mode==='concepts'?(D.concept_count||0):mode==='alignments'?(D.counts.record_alignments||0):mode==='unresolved'?(D.counts.unresolved||0):items.length;$('scope').textContent=`当前显示 ${items.length} 条 / 本视图 ${total} 条；预览最多 ${D.limit} 条。完整证据保存在运行目录。`;return}
let {nodes,edges,total}=graphData();if(q){const match=new Set(nodes.filter(n=>JSON.stringify(n).toLowerCase().includes(q)).map(n=>n.id));edges.forEach(e=>{if((e.label||'').toLowerCase().includes(q)){match.add(e.source);match.add(e.target)}});const nearby=new Set(match);edges.forEach(e=>{if(match.has(e.source)||match.has(e.target)){nearby.add(e.source);nearby.add(e.target)}});nodes=nodes.filter(n=>nearby.has(n.id))}const ids=new Set(nodes.map(n=>n.id));edges=edges.filter(e=>ids.has(e.source)&&ids.has(e.target));
const svg=$('graph');viewWidth=Math.max(280,svg.clientWidth||900);svg.setAttribute('viewBox',`0 0 ${viewWidth} 530`);svg.replaceChildren();const defs=svgEl('defs'),marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#90a9ca'}));defs.append(marker);svg.append(defs);graphGroup=svgEl('g');svg.append(graphGroup);const positions=new Map(),groups=[...new Set(nodes.map(n=>n.group))],colors=['#487ccc','#55a49a','#a47cc4','#d6a253','#ca7887','#6e8da0'];groups.forEach((group,g)=>{const members=nodes.filter(n=>n.group===group),cols=Math.ceil(members.length/10);members.forEach((n,i)=>positions.set(n.id,{x:groups.length===1?50+(i%Math.max(2,Math.floor((viewWidth-60)/90)))*90:30+(g+0.5)*(viewWidth-60)/groups.length+(Math.floor(i/10)-(cols-1)/2)*42,y:groups.length===1?65+Math.floor(i/Math.max(2,Math.floor((viewWidth-60)/90)))*66:55+(i%10)*430/Math.min(10,members.length),color:colors[g%colors.length]}))});
edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,line=svgEl('path',{d:e.source===e.target?`M ${a.x} ${a.y-14} C ${a.x+60} ${a.y-70},${a.x+65} ${a.y+40},${a.x+13} ${a.y}`:`M ${a.x+dx/len*17} ${a.y+dy/len*17} L ${b.x-dx/len*21} ${b.y-dy/len*21}`,class:'edge','marker-end':'url(#arrow)',tabindex:0,role:'button','aria-label':e.label});line.onclick=()=>show(e,e.label);line.onkeydown=v=>{if(v.key==='Enter')show(e,e.label)};line.append(svgEl('title'));line.firstChild.textContent=e.label;graphGroup.append(line);if(edges.length<25){const label=svgEl('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,class:'edge-label','text-anchor':'middle'});label.textContent=e.label;graphGroup.append(label)}});
nodes.forEach(n=>{const p=positions.get(n.id),g=svgEl('g',{class:'node',transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':n.label});g.append(svgEl('circle',{r:15,fill:p.color}));const label=svgEl('text',{y:31,'text-anchor':'middle'});label.textContent=String(n.label).slice(0,18);g.append(label);const tip=svgEl('title');tip.textContent=n.id;g.append(tip);g.onclick=()=>show(n,n.label);g.onkeydown=e=>{if(e.key==='Enter')show(n,n.label)};graphGroup.append(g)});transform();$('scope').textContent=`当前显示 ${nodes.length} 个节点、${edges.length} 条关系；该视图共 ${total} 个节点，预览上限 ${D.limit}。${mode==='instances'?'完整实例及证据保存在运行目录。':mode==='types'?'包含预先定义的根类型；不表示输入涵盖全部类型。':'声明关系仅来自输入元数据。'}`;if(!nodes.length){const t=svgEl('text',{x:viewWidth/2,y:240,'text-anchor':'middle',fill:'#7a8799'});t.textContent='没有匹配的节点';svg.append(t)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;scale=1;pan={x:0,y:0};$('search').value='';$('details').replaceChildren(el('h2','查看详情'),el('p','选择当前视图中的记录，查看定义、状态及证据。','muted'));document.querySelectorAll('[data-mode]').forEach(n=>{n.classList.toggle('active',n===b);n.setAttribute('aria-pressed',String(n===b))});render()});$('search').oninput=render;$('zoom-in').onclick=()=>{scale=Math.min(3,scale*1.2);transform()};$('zoom-out').onclick=()=>{scale=Math.max(.4,scale/1.2);transform()};$('reset').onclick=()=>{scale=1;pan={x:0,y:0};transform()};$('graph').addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.4,Math.min(3,scale*(e.deltaY<0?1.1:.9)));transform()},{passive:false});let drag=null;$('graph').onpointerdown=e=>{if(e.target===$('graph')){drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};$('graph').setPointerCapture(e.pointerId)}};$('graph').onpointermove=e=>{if(drag){pan={x:drag.px+e.clientX-drag.x,y:drag.py+e.clientY-drag.y};transform()}};$('graph').onpointerup=()=>drag=null;window.addEventListener('resize',render);render();
</script></body></html>
