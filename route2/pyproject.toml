[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-route2"
version = "0.3.0"
description = "Evidence-bound YAML ontology prototype with bounded AgentScope/MCP retrieval"
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.8",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "duckdb>=1.4,<2",
    "rdflib>=7,<8",
    "python-dotenv>=1,<2",
    "mcp>=1.25,<2",
    "socksio>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
embedding = ["numpy>=2,<3", "sentence-transformers>=5.7,<7"]

[project.scripts]
ontology-r2 = "ontology_r2.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["ontology_r2*"]

[tool.setuptools.package-data]
ontology_r2 = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
