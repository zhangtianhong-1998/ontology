# Run with a locally reachable OpenAI-compatible model and explicit CSV/YAML input.
# Copy this file to local_config/runtime.real.yaml and set dataset to your input directory.
synthetic: false
dataset: ../local_data/input
data_scope: unknown
model_profile: ../ontologies/internal_model.yaml
env_file: ../.env
memory_limit: 2GB
shard_size: 5000
progress:
  enabled: true
  min_interval_seconds: 1.0
profiling:
  sql_columns_per_group: 32
discovery:
  enabled: true
  max_indexed_fields: 64
  max_candidate_validations: 12
  max_evidence_per_unit: 3
  # Only checked raw-equality candidates currently support joined examples.
  max_joint_pairs_per_candidate: 1
  max_joint_example_bytes: 16000
# Bounded definition-record evidence enters the per-table LLM packet; pairs remain unjudged.
concept_recall:
  enabled: true
  max_definition_tables: 8
  max_records_per_table: 32
  max_total_records: 256
  max_candidates: 60
  max_field_chars: 160
  max_candidates_per_unit: 2
# Diagnostic alias leads only; no relation plan is generated from sample matches.
alias_recall:
  enabled: true
  max_fields: 64
  max_rows_per_table: 5000
  max_values_per_field: 128
  max_pairs: 200
llm:
  mode: agentscope
  stream: false
  thinking:
    mode: disabled
    parameter: chat_template_kwargs
    effort: medium
  # Shared by generation, Judge, retrieval, alignment, and semantic matching.
  max_calls: 800
  # admit() reserves UTF-8 request bytes + max_output_tokens per call.
  # 90M covers 800 calls even at the 100K input-byte limit.
  max_reserved_tokens: 90000000
  max_input_bytes: 100000
  max_output_tokens: 4096
  # One initial attempt plus four repairs per table; the table pass remains one.
  max_repairs: 4
  # Retry transient 5xx/network errors; a timeout does not repeat unchanged semantic repairs.
  max_retries: 3
  timeout_seconds: 60
# Optional local semantic recall for external ontology cards and accepted core. Set enabled to
# true after placing the model at ONTOLOGY_EMBEDDING_MODEL_PATH in .env.
embedding:
  enabled: false
  model_path: null
  batch_size: 16
  max_cards: 20000
  core_top_k: 5
  min_cosine_similarity: 0.35
  query_prompt: null
mcp:
  enabled: false
external:
  enabled: false
processing:
  # Keep the ontology experiment bounded: relation plans materialize referenced records.
  # Turn this on only when a full instance copy (and its disk cost) is needed.
  materialize_all_objects: false
  # Retain a few source records for the local viewer even without accepted relations.
  preview_objects_per_table: 3
  # When enabled, exceeding the cap appears in manifest.partial_reasons.
  max_object_records: 1200000
  max_relation_records: 100000
  max_text_groups: 100
  candidate_top_k: 10
  max_references_per_record: 100
visualization:
  enabled: true
  max_nodes: 200
