# Run with a locally reachable OpenAI-compatible model and explicit CSV/YAML input.
# Copy this file to local_config/runtime.real.yaml and set dataset to your input directory.
synthetic: false
dataset: ../local_data/input
data_scope: unknown
model_profile: ../ontologies/internal_model.yaml
env_file: ../.env
memory_limit: 2GB
shard_size: 5000
progress:
  enabled: true
  min_interval_seconds: 1.0
profiling:
  sql_columns_per_group: 32
discovery:
  enabled: true
  max_indexed_fields: 64
  max_candidate_validations: 12
  max_evidence_per_unit: 3
llm:
  mode: agentscope
  stream: false
  thinking:
    mode: disabled
    parameter: chat_template_kwargs
    effort: medium
  # Shared by generation, Judge, retrieval, alignment, and semantic matching.
  max_calls: 800
  # admit() reserves UTF-8 request bytes + max_output_tokens per call.
  # 90M covers 800 calls even at the 100K input-byte limit.
  max_reserved_tokens: 90000000
  max_input_bytes: 100000
  max_output_tokens: 4096
  # One initial attempt plus four repairs per table; the table pass remains one.
  max_repairs: 4
  timeout_seconds: 60
# Optional local semantic recall for external ontology cards and accepted core. Set enabled to
# true after placing the model at ONTOLOGY_EMBEDDING_MODEL_PATH in .env.
embedding:
  enabled: false
  model_path: null
  batch_size: 16
  max_cards: 20000
  core_top_k: 5
  min_cosine_similarity: 0.35
  query_prompt: null
mcp:
  enabled: false
external:
  enabled: false
processing:
  materialize_all_objects: true
  max_object_records: 1000000
  max_relation_records: 100000
  max_text_groups: 100
  candidate_top_k: 10
  max_references_per_record: 100
visualization:
  enabled: true
  max_nodes: 200
