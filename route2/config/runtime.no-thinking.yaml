# Live LLM with thinking explicitly disabled; uses synthetic data and mock MCP.
# Select thinking.parameter for your model service before running.
synthetic: true
dataset: ../fixtures/linked
data_scope: sample
model_profile: ../ontologies/internal_model.yaml
env_file: ../.env
memory_limit: 1GB
shard_size: 5000
progress:
  enabled: true
  min_interval_seconds: 1.0
llm:
  stream: true
  thinking:
    mode: disabled
    parameter: chat_template_kwargs
    effort: medium
  mode: agentscope
  responses: ../fixtures/linked/mock_llm.yaml
  max_calls: 30
  max_reserved_tokens: 2000000
  max_input_bytes: 100000
  max_output_tokens: 4096
  max_repairs: 1
  timeout_seconds: 60
mcp:
  enabled: true
  mock_documents: ../fixtures/linked/mock_documents.yaml
  max_rounds: 3
  max_units: 5
  timeout_seconds: 15
  max_document_bytes: 16000
  max_tool_calls: 20
  max_documents: 10
  max_tool_response_bytes: 40000
  agent_timeout_seconds: 240
external:
  enabled: false
  sources:
    - id: gist
      format: rdf
      path: ../ontologies/gist/ontologies/gistCore.ttl
processing:
  materialize_all_objects: true
  max_object_records: 1000000
  max_relation_records: 1000000
  max_text_groups: 100
  candidate_top_k: 10
  max_references_per_record: 100
visualization:
  enabled: true
  max_nodes: 200
