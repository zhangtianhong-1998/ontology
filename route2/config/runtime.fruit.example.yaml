# Generate the ignored local data first: uv run python scripts/generate_fruit_data.py generate --output local_data/fruit_smoke --scale 0.001
# Copy to a local config if you need different limits. Credentials come from ../.env.
synthetic: true
dataset: ../local_data/fruit_smoke
data_scope: sample
model_profile: ../ontologies/internal_model.yaml
env_file: ../.env
memory_limit: 2GB
privacy: {exclude_columns: []}
shard_size: 5000
progress: {enabled: true, min_interval_seconds: 1.0}
profiling: {sql_columns_per_group: 32}
discovery:
  enabled: true
  max_indexed_fields: 64
  max_candidate_validations: 50
  max_evidence_per_unit: 3
  max_joint_pairs_per_candidate: 1
  max_joint_example_bytes: 16000
association_rules:
  enabled: true
  agent_enabled: false
  max_rules: 60
  max_explicit_validations: 8
concept_recall: {enabled: false}
alias_recall: {enabled: false}
instance_bundles:
  enabled: true
  max_cards: 10000
  max_concept_bundles: 12
  max_relation_bundles: 12
  max_seeds_per_table: 8
  lexical_top_k: 8
  max_candidates_per_bundle: 3
  max_bundle_bytes: 16000
  vector_enabled: false
  max_joint_pairs_per_rule: 2
  max_llm_bundles: 4
  review: true
llm:
  mode: agentscope
  stream: false
  # Volcengine DeepSeek V4 Flash: chat_template_kwargs does not disable reasoning;
  # thinking.type=disabled was verified against the configured endpoint.
  thinking: {mode: disabled, parameter: thinking, effort: medium}
  max_calls: 100
  max_reserved_tokens: 8000000
  max_input_bytes: 80000
  # Review of a full table may need more than 2K output tokens. A truncated
  # finish_reason=length is rejected, even if a tool-call fragment exists.
  max_output_tokens: 8192
  max_repairs: 0
  max_retries: 1
  timeout_seconds: 120
embedding: {enabled: false, model_path: null, batch_size: 16, max_cards: 20000, core_top_k: 5, min_cosine_similarity: 0.35, query_prompt: null}
mcp: {enabled: false}
external: {enabled: false}
processing:
  materialize_all_objects: false
  preview_objects_per_table: 2
  max_object_records: 1200000
  max_relation_records: 10000
  max_text_groups: 100
  candidate_top_k: 10
  max_references_per_record: 100
visualization: {enabled: true, max_nodes: 200}
