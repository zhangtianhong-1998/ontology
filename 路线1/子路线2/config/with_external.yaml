config_version: "0.1"
route: route1
profile: E1B
model_profile: ../ontologies/internal_model.yaml
input:
  root: "${DATASET_DIR}"
  metadata_dir: schema
  read_csv: false
  scope: sample
seed: {load_previous_core: false}
llm:
  model: "${ONTOLOGY_LLM_MODEL}"
  base_url: "${ONTOLOGY_LLM_BASE_URL}"
  api_key_env: ONTOLOGY_LLM_API_KEY
  temperature: 0
  max_repairs: 2
  timeout_seconds: 60
  max_calls: 300
  max_total_tokens: 600000
external_ontology:
  enabled: true
  allow_network_imports: false
  top_k: 5
  sources:
    - id: kpionto
      format: rdf
      path: "../ontologies/KPIOnto/kpionto.ttl"
      version: "1c36644a40123447fb6469b9832865b4b4c2f7ba"
      sha256: "1cb6a3a81ecaeb76d2ef592181d80339ce98c09bac60f8558e8f37a0b7cebef2"
# 默认只试一个模型；其他模型通过同一 sources 列表配置，见 shared/sources.md。
enterprise_rag: {enabled: false}
output: {root: ../runs, shard_size: 5000}
