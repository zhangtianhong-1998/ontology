- column_name: forecast_flag
  ordinal_position: 9
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: forecast flag，合成业务字段
- column_name: actual_flag
  ordinal_position: 10
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: actual flag，合成业务字段
- column_name: target_flag
  ordinal_position: 11
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: target flag，合成业务字段
- column_name: remain_flag
  ordinal_position: 12
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: remain flag，合成业务字段
- column_name: estimate_flag
  ordinal_position: 13
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: estimate flag，合成业务字段
- column_name: rank_flag
  ordinal_position: 14
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: rank flag，合成业务字段
- column_name: period
  ordinal_position: 15
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 口径明确限定的期间粒度；空值表示由指标的期间绑定决定
- column_name: inference_type
  ordinal_position: 16
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 计算方法，例如 SUM、AVG、RATIO；是计算属性，不是单独本体类型
- column_name: domain_code
  ordinal_position: 17
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: domain code，合成业务字段
- column_name: source_field
  ordinal_position: 18
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 量的计算来源；表达式表示该度量的计算公式，空值表示基础聚合量
- column_name: metric_code
  ordinal_position: 19
  data_type: character varying(255)
  is_not_null: false
