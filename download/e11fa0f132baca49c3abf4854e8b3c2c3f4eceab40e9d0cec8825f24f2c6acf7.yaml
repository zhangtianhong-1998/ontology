schema: fruit_market
table_name: fruit_measure_def
table_comment: 水果经营度量定义与期间标记
relkind: r
estimated_rows: 5000
total_size: null
data_size: null
columns:
- column_name: fruit_measure_id
  ordinal_position: 1
  data_type: bigint
  is_not_null: true
  default_value: null
  column_comment: fruit measure id，合成业务字段
- column_name: measure_code
  ordinal_position: 2
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 度量编码，对应度量定义
- column_name: measure_name
  ordinal_position: 3
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 度量中文业务名称
- column_name: standard_name
  ordinal_position: 4
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 不绑定具体经营对象的可复用度量标准名称
- column_name: parameter_name
  ordinal_position: 5
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 度量英文别名，也是计算公式中的变量名；不同版本可重复使用
- column_name: measure_description
  ordinal_position: 6
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 度量的业务含义、聚合口径和适用范围
- column_name: unit
  ordinal_position: 7
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 计量单位；不同单位不可直接合并
- column_name: budget_flag
  ordinal_position: 8
  data_type: character varying(255)
  is_not_null: false
