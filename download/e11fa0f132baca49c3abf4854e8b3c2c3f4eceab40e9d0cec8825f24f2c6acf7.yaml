- column_name: delete_flag
  ordinal_position: 20
  data_type: character varying(255)
  is_not_null: false
  default_value: null
  column_comment: 逻辑删除标记，0 为有效
- column_name: created_by
  ordinal_position: 21
  data_type: character varying(255)
